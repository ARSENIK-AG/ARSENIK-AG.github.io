:root{--bg:#0d0e11;--card:#16181d;--card2:#1d2027;--line:#2a2e37;--txt:#f2f3f5;--mut:#8b919d;--dim:#5d636e;--acc:#c8f560;--cb:#5ab0ff;--bt:#ff9a4d;--sh:#c8f560;--red:#ff5d5d;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:16px}
body{min-height:100vh}
#app{max-width:560px;margin:0 auto;padding:18px 16px 120px}
h1,h2,h3,.cond{font-family:"Barlow Condensed",Inter,sans-serif;letter-spacing:.3px;margin:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea{font:inherit;color:var(--txt)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.brand{font-size:13px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:1.6px}
.iconbtn{width:40px;height:40px;border-radius:12px;background:var(--card);display:grid;place-items:center;color:var(--mut)}
.iconbtn svg{width:20px;height:20px}
.hero{background:linear-gradient(145deg,#1b1e24,#121418);border:1px solid var(--line);border-radius:24px;padding:22px;display:flex;align-items:center;gap:18px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(200,245,96,.14),transparent 70%)}
.hero .lbl{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:1.4px;font-weight:600}
.hero h1{font-size:56px;line-height:.95;font-weight:800}
.hero .sub{color:var(--mut);font-size:14px;margin-top:6px}
.ring{width:84px;height:84px;flex:none;position:relative;z-index:1}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-family:"Barlow Condensed",system-ui,sans-serif;font-weight:700;font-size:22px}
.cyclenav{display:flex;gap:6px;margin-top:12px}
.pill{padding:7px 12px;border-radius:999px;background:var(--card2);font-size:13px;font-weight:600;color:var(--mut)}
.pill.on{background:var(--acc);color:#111}
.sect{margin:26px 2px 10px;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:1.4px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.day{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:10px;width:100%;text-align:left}
.day .bar{width:6px;align-self:stretch;border-radius:6px}
.day h3{font-size:24px;font-weight:700}
.day .meta{font-size:13px;color:var(--mut);margin-top:2px}
.day .st{margin-left:auto;font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px;background:var(--card2);color:var(--mut);white-space:nowrap}
.day .st.done{background:rgba(200,245,96,.15);color:var(--acc)}
.day .st.prog{background:rgba(255,154,77,.15);color:var(--bt)}
.big{width:100%;padding:16px;border-radius:16px;font-weight:700;font-size:16px;background:var(--acc);color:#111;margin-top:8px}
.big.ghost{background:var(--card);color:var(--txt);border:1px solid var(--line)}
.big.danger{background:rgba(255,93,93,.12);color:var(--red);border:1px solid rgba(255,93,93,.3)}
.dayhead{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.dayhead h2{font-size:34px;font-weight:800;line-height:1}
.dayhead .c{font-size:13px;color:var(--mut);font-weight:600}
.ex{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:12px}
.ex.complete{border-color:rgba(200,245,96,.35)}
.exh{display:flex;align-items:flex-start;gap:10px}
.exh .n{font-family:"Barlow Condensed",system-ui,sans-serif;font-weight:700;font-size:21px;line-height:1.1;flex:1}
.exh .num{font-family:"Barlow Condensed",system-ui,sans-serif;font-weight:700;font-size:14px;color:var(--dim);width:22px;padding-top:3px}
.last{font-size:12.5px;color:var(--mut);margin:6px 0 12px 32px}
.last b{color:var(--txt);font-weight:600}
.sets{display:grid;gap:8px}
.set{display:grid;grid-template-columns:28px 1fr 1fr;gap:8px;align-items:center}
.set .k{font-family:"Barlow Condensed",system-ui,sans-serif;font-weight:700;color:var(--dim);font-size:16px;text-align:center}
.fld{position:relative}
.fld input{width:100%;background:var(--card2);border:1px solid transparent;border-radius:12px;padding:13px 40px 13px 14px;font-size:18px;font-weight:600;outline:none}
.fld input:focus{border-color:var(--acc)}
.fld input::placeholder{color:#4b505a;font-weight:500}
.fld i{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-style:normal;font-size:12px;color:var(--dim);pointer-events:none}
.note{width:100%;margin-top:10px;background:transparent;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:14px;outline:none;color:var(--mut)}
.note:focus{border-color:var(--mut);color:var(--txt)}
.addset{font-size:13px;color:var(--mut);margin-top:8px;padding:4px 2px;font-weight:600}
.savebar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 35%);z-index:5;display:none}
.savebar.show{display:block}
.savebar .in{max-width:560px;margin:0 auto;display:flex;gap:10px;align-items:center}
.savebar .msg{flex:1;font-size:13px;color:var(--mut);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.savebar button{background:var(--acc);color:#111;font-weight:700;padding:15px 22px;border-radius:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 13px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--mut)}
.chip.on{background:var(--txt);color:#111;border-color:var(--txt)}
.hcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:12px}
.hrow{display:grid;grid-template-columns:62px 1fr 64px;gap:8px;padding:11px 0;border-top:1px solid var(--line);font-size:14px;align-items:center}
.hrow:first-of-type{border-top:0}
.hrow .cy{font-family:"Barlow Condensed",system-ui,sans-serif;font-weight:700;font-size:17px}
.hrow .best{text-align:right;font-weight:700;color:var(--acc)}
.hrow .sx{color:var(--mut)}
.hrow .sx b{color:var(--txt);font-weight:600}
.empty{color:var(--mut);font-size:14px;padding:18px 4px;text-align:center}
.edrow{display:flex;gap:8px;align-items:center;margin-top:8px}
.edrow input{flex:1;background:var(--card2);border:1px solid transparent;border-radius:12px;padding:12px;font-size:15px;outline:none}
.edrow input:focus{border-color:var(--acc)}
.sm{width:38px;height:42px;border-radius:10px;background:var(--card2);color:var(--mut);display:grid;place-items:center;flex:none}
.sm svg{width:16px;height:16px}
textarea.bk{width:100%;min-height:110px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:12px;font-family:ui-monospace,monospace;outline:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:end center;z-index:10;padding:16px}
.modal .box{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;width:100%;max-width:520px;margin-bottom:env(safe-area-inset-bottom)}
.modal h3{font-size:26px;margin-bottom:8px}
.modal p{color:var(--mut);font-size:15px;line-height:1.45;margin:0 0 16px}
.row2{display:flex;gap:10px}.row2 button{flex:1;margin:0}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--txt);color:#111;padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:20}
.warn{font-size:12.5px;color:var(--bt);background:rgba(255,154,77,.1);border-radius:12px;padding:10px 12px;margin-top:14px}
svg.spark{width:100%;height:70px;display:block;margin:6px 0 4px}
.iconbtn.on{background:var(--acc);color:#111}
.lbl{font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:1.3px;font-weight:600}
.cyclenav{overflow-x:auto;scrollbar-width:none;scroll-behavior:smooth;max-width:100%}
.cyclenav::-webkit-scrollbar{display:none}
.cyclenav .pill{flex:none}
.bwcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.bwtop{display:flex;align-items:center;gap:14px;width:100%;text-align:left}
.bwv{font-family:"Barlow Condensed",system-ui,sans-serif;font-size:40px;font-weight:700;line-height:1;margin-top:4px}
.bwv small{font-size:18px;color:var(--mut)}
.bwd{font-size:13px;color:var(--mut);margin-top:4px}
.upc{color:var(--bt)}.dnc{color:var(--acc)}
.bwin{display:flex;gap:10px;margin-top:14px}
.bwin button{background:var(--cb);color:#0b1a2b;font-weight:700;padding:0 22px;border-radius:12px}
.bwrow{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding:4px 0}
.bwrow:first-child{border-top:0}
.bwedit{flex:1;display:grid;grid-template-columns:1fr auto 52px;gap:10px;align-items:center;text-align:left;padding:10px 0;font-size:14px}
.bwedit span{color:var(--mut)}.bwedit b{font-size:16px}.bwedit em{font-style:normal;font-size:12.5px;text-align:right}
.sm.del{color:#b0646a}
input[type=date]{background:var(--card2);border:1px solid transparent;border-radius:12px;padding:12px;font-size:15px;color:var(--txt);min-height:50px;-webkit-appearance:none;color-scheme:dark}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 4px}
.stats>div{background:var(--card2);border-radius:12px;padding:10px 11px}
.stats b{display:block;font-family:"Barlow Condensed",system-ui,sans-serif;font-size:22px;font-weight:700;margin-top:3px}
.stats span{font-size:11.5px;color:var(--mut)}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;margin:14px 0 6px}
.seg button{flex:1;padding:8px 4px;border-radius:9px;font-size:13px;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--txt);color:#111}
svg.chart{width:100%;height:auto;display:block;touch-action:pan-y;user-select:none;-webkit-user-select:none}
svg.chart .ax{font-size:10px;fill:#6b717c;font-family:Inter,system-ui,sans-serif}
svg.chart .tip{font-size:11.5px;font-weight:700;fill:#111;font-family:Inter,system-ui,sans-serif}
.hint{font-size:12px;color:var(--dim);margin-top:4px}
.mini{width:32px;height:32px;border-radius:9px;background:var(--card2);color:var(--mut);display:grid;place-items:center;flex:none}
.mini svg{width:16px;height:16px}
.prb{display:inline-block;font-family:Inter,sans-serif;font-size:10.5px;font-weight:800;background:var(--acc);color:#111;padding:2px 7px;border-radius:999px;vertical-align:3px;letter-spacing:.5px}
.restrow{display:flex;align-items:center;gap:6px;margin:14px 0 2px;overflow-x:auto}
.restrow span{font-size:12px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:1px;margin-right:4px;white-space:nowrap}
.restrow button{flex:none;padding:8px 13px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600}
#resttimer{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:15;display:flex;align-items:center;gap:12px;background:#1d2027;border:1px solid var(--line);border-radius:999px;padding:8px 8px 8px 18px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#resttimer span{font-size:12px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:1px}
#resttimer b{font-family:"Barlow Condensed",system-ui,sans-serif;font-size:26px;min-width:52px;text-align:center}
#resttimer button{background:var(--card2);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600}
#resttimer.over{background:var(--acc);border-color:var(--acc)}
#resttimer.over span,#resttimer.over b{color:#111}
input.dayname{font-family:"Barlow Condensed",system-ui,sans-serif;font-size:22px!important;font-weight:700}
.hero h1{white-space:nowrap;font-size:clamp(40px,13vw,56px)}
.stats b{font-size:19px;white-space:nowrap}
.stats b small{font-size:12px;color:var(--mut);font-weight:600}
.edrow input{min-width:0}.edrow .sm{width:36px}
.day.isnext{border-color:rgba(200,245,96,.45);background:linear-gradient(135deg,rgba(200,245,96,.07),var(--card) 60%)}
.day .st.next{background:var(--acc);color:#111}

#app{padding-top:calc(18px + env(safe-area-inset-top))}
.onb{min-height:80vh;display:flex;flex-direction:column;justify-content:center;gap:4px;padding-top:40px}
.onb .logo{margin-bottom:18px}.onb h1{font-size:52px;font-weight:800}
.onb p{color:var(--mut);line-height:1.5;margin:8px 0 18px}
label.big{cursor:pointer}
button.warn{border:0;font:inherit;font-size:12.5px}

  if(rows.length){h+=seg('lift',[['top','Top weight'],['1rm','Est. 1RM'],['vol','Volume']],liftMetric)+lineChart(pts,{unit:'kg',color:'#c8f560'});if(liftMetric==='1rm')h+='<div class="hint">Estimated one-rep max from your best set (Epley formula).</div>';if(liftMetric==='vol')h+='<div class="hint">Total kg × reps across all sets.</div>'}
  if(!rows.length)h+='<div class="empty">Nothing logged yet for this exercise.</div>';
  rows.slice().reverse().forEach(function(r){h+='<div class="hrow"><div class="cy">C'+r.c+'</div><div class="sx">'+r.e.sets.map(fmtSet).filter(Boolean).map(function(s){return '<b>'+esc(s)+'</b>'}).join(' · ')+(r.e.note?'<div style="font-size:12px;margin-top:3px">'+esc(r.e.note)+'</div>':'')+'</div><div class="best">'+(r.b!=null?r.b+' kg':'')+'</div></div>'});
  h+='</div>'}
 return h;
}

function weightView(){
 var L=bwSorted();
 var h='<div class="top"><button class="iconbtn" data-go="">'+ICON.back+'</button><div class="brand">Body weight</div><div style="width:40px"></div></div><h2 style="font-size:34px;font-weight:800">Body weight</h2>';
 h+='<div class="hcard"><div class="lbl" style="margin-bottom:8px">Add entry</div><div class="edrow" style="margin-top:0"><div class="fld" style="flex:.8"><input id="bwday" inputmode="numeric" autocomplete="off" value="'+nextDay()+'" style="padding-left:52px"><i style="left:14px;right:auto">Day</i></div><div class="fld" style="flex:1"><input id="bwval" inputmode="decimal" autocomplete="off" placeholder="Weight"><i>kg</i></div></div><button class="big" id="bwadd" style="margin-top:10px">Save weight</button></div>';
 if(L.length){
  var last=L[L.length-1],first=L[0],wk=L.filter(function(x){return x.n>last.n-7});
  var avg=r1(wk.reduce(function(a,x){return a+x.w},0)/wk.length),ch=last.w-first.w,pct=first.w?r1(ch/first.w*100):0;
  var pw=L.filter(function(x){return x.n<=last.n-7&&x.n>last.n-14}),pavg=pw.length?r1(pw.reduce(function(a,x){return a+x.w},0)/pw.length):null;
  h+='<div class="hcard"><div class="stats"><div><div class="lbl">Latest</div><b>'+last.w+'<small> kg</small></b><span>Day '+last.n+'</span></div><div><div class="lbl">7-day avg</div><b>'+avg+'<small> kg</small></b><span>'+(pavg!=null?(avg-pavg>0?'+':'')+r1(avg-pavg)+' vs last wk':wk.length+' entries')+'</span></div><div><div class="lbl">Total</div><b class="'+(ch>0?'upc':'dnc')+'">'+(ch>0?'+':'')+r1(ch)+'<small> kg</small></b><span>'+(pct>0?'+':'')+pct+'% from D'+first.n+'</span></div></div>';
  var span={'14':14,'30':30,'90':90,'all':1e9}[bwRange]||1e9;
  var CL=L.filter(function(x){return x.n>last.n-span});
  h+=seg('bw',[['14','14D'],['30','30D'],['90','90D'],['all','All']],bwRange)+lineChart(CL.map(function(x){return{l:'D'+x.n,t:'Day '+x.n,y:x.w}}),{unit:'kg',color:'#5ab0ff'})+'</div>';
  h+='<div class="sect"><span>History</span><span>tap to edit</span></div><div class="hcard" style="padding:4px 16px">';
  L.slice().reverse().forEach(function(x,i,arr){var pv=arr[i+1];var df=pv?r1(x.w-pv.w):null;h+='<div class="bwrow"><button class="bwedit" data-bwedit="'+x.n+'"><span>Day '+x.n+'</span><b>'+x.w+' kg</b><em class="'+(df>0?'upc':'dnc')+'">'+(df==null?'':(df>0?'+':'')+df)+'</em></button><button class="sm del" data-bwdel="'+x.n+'">'+ICON.x+'</button></div>'});
  h+='</div>';
 }else h+='<div class="empty">Log your first weigh-in above. Same time each morning gives the cleanest trend.</div>';
 return h;
}

function settings(){
 var h='<div class="top"><button class="iconbtn" data-go="">'+ICON.back+'</button><div class="brand">Settings</div><div style="width:40px"></div></div><h2 style="font-size:34px;font-weight:800">Settings</h2>';
 h+='<div class="hcard"><div class="lbl" style="margin-bottom:8px">Current cycle</div><div style="display:flex;align-items:center;gap:12px"><button class="sm" data-cadj="-1" style="width:48px;font-size:22px">−</button><div class="cond" style="font-size:30px;font-weight:700;flex:1;text-align:center">Cycle '+S.cycle+'</div><button class="sm" data-cadj="1" style="width:48px;font-size:22px">+</button></div></div>';
 S.days.forEach(function(d){h+='<div class="hcard"><div class="edrow" style="margin-top:0"><input class="dayname" data-dayname="'+d.id+'" value="'+esc(d.name)+'" style="color:var(--'+d.color+')"></div>'+exEditRows(d)+'<button class="addset" data-addex="'+d.id+'">+ Add exercise</button></div>'});
 if(S.archived.length){h+='<div class="sect"><span>Removed exercises</span></div><div class="hcard"><div style="font-size:13px;color:var(--mut);margin-bottom:4px">Their history stays in Progress. Restore puts one back in its day.</div>';S.archived.forEach(function(a){var dd=day(a.day);h+='<div class="edrow"><div style="flex:1;font-size:15px">'+esc(a.name)+'<div style="font-size:12px;color:var(--mut)">'+esc(dd?dd.name:'')+'</div></div><button class="pill" data-unarch="'+a.id+'">Restore</button></div>'});h+='</div>'}
 h+='<div class="sect"><span>Backup</span></div><div class="hcard"><div style="font-size:14px;color:var(--mut);margin-bottom:10px">Everything is stored on this phone. Download a backup now and then and keep it in Files or iCloud Drive.'+(S.lastBackup?' Last backup: '+new Date(S.lastBackup).toLocaleDateString('en-GB',{day:'numeric',month:'short'})+'.':'')+'</div><div class="row2"><button class="big" id="dlbk">Download backup</button><label class="big ghost" style="text-align:center;margin-top:8px">Restore file<input type="file" accept=".json,application/json" id="impfile" hidden></label></div></div>';
 h+='<button class="big danger" id="wipe" style="margin-top:22px">Clear all logged workouts</button>';
 return h;
}

function render(){
 var r=route(),m=r.match(/^c(\d+)-(.+)$/),h;
 if(m){var c=+m[1];if(c<1||c>S.cycle)c=S.cycle;h=dayView(c,m[2])}
 else if(r==='history')h=history();
 else if(r==='settings')h=settings();
 else if(r==='weight')h=weightView();
 else h=home();
 $('#app').innerHTML=h;
 showBar();
 var cn=$('#cnav'),on=cn&&cn.querySelector('.on');if(on)cn.scrollLeft=on.offsetLeft-cn.clientWidth+on.offsetWidth+8;
}

function delEx(dayId,exId){var dd=day(dayId),x=dd.exercises.filter(function(z){return z.id===exId})[0];if(!x)return;var keep=exHasAny(dayId,exId);modal('Remove exercise?','"'+x.name+'" will be removed from '+dd.name+'.'+(keep?' Its history stays in Progress under Old exercises.':''),'Remove',function(){dd.exercises=dd.exercises.filter(function(z){return z.id!==exId});if(keep)S.archived.push({id:x.id,name:x.name,day:dayId});markDirty();render()},true)}
function logBW(dt,raw){dt=parseInt(dt,10);if(!(dt>0)){toast('Enter a day number');return false}var w=num(raw);if(w==null||w<20||w>400){toast('Enter a weight in kg');return false}bwSet(dt,r1(w));markDirty();save('Weight saved');render();return true}

document.addEventListener('input',function(ev){
 var t=ev.target,r=route(),m=r.match(/^c(\d+)-(.+)$/);
 if(m&&t.dataset.ex){var e=entry(+m[1],m[2],t.dataset.ex,true);e.sets[+t.dataset.s][+t.dataset.f]=t.value.trim();var D=entry(+m[1],m[2]);if(!D.date)D.date=today();markDirty();var card=t.closest('.ex');if(card){card.classList.toggle('complete',e.sets.some(function(s){return s[0]!==''&&s[1]!==''}));var pb=priorBest(+m[1],m[2],t.dataset.ex),cb=bestW(e),pe=card.querySelector('.prb');if(pe)pe.style.display=(pb!=null&&cb!=null&&cb>pb)?'':'none'}}
 else if(m&&t.dataset.note!=null){entry(+m[1],m[2],t.dataset.note,true).note=t.value;markDirty()}
 else if(t.dataset.ren){var p=t.dataset.ren.split('|'),d=day(p[0]);d.exercises.forEach(function(x){if(x.id===p[1])x.name=t.value});markDirty()}
 else if(t.dataset.dayname){day(t.dataset.dayname).name=t.value;markDirty()}
});
document.addEventListener('change',function(ev){if(ev.target.id==='impfile'&&ev.target.files[0]){var f=ev.target.files[0];if(fresh)importFile(f);else modal('Restore this file?','This replaces everything currently in the tracker.','Restore',function(){importFile(f)},true)}});
document.addEventListener('keydown',function(ev){if(ev.key==='Enter'&&ev.target.id==='bwin'){ev.preventDefault();$('#bwlog').click()}});
document.addEventListener('click',function(ev){
 var t=ev.target.closest('button');if(!t)return;
 var r=route(),m=r.match(/^c(\d+)-(.+)$/);
 if(t.dataset.go!=null)return go(t.dataset.go);
 if(t.dataset.cyc){viewCycle=+t.dataset.cyc;return render()}
 if(t.id==='dlbk'){downloadBackup();return}
 if(t.id==='startfresh'){save();render();return}
 if(t.id==='editday'||t.id==='editdone'){editMode=!editMode;render();window.scrollTo(0,0);return}
 if(t.id==='newcyc'){var c=S.cycle,left=S.days.filter(function(d){return dayStatus(c,d.id)!=='done'}).length;var doit=function(){S.cycle++;viewCycle=null;markDirty();render();save('Cycle '+S.cycle+' started')};if(left)modal('Start Cycle '+(c+1)+'?',left+' workout'+(left>1?'s':'')+' in Cycle '+c+' not finished yet. You can still go back and fill them in later.','Start',doit);else doit();return}
 if(t.id==='finish'&&m){var D=entry(+m[1],m[2],null,true);D.done=true;if(!D.date)D.date=today();markDirty();go('');save('Workout saved 💪');return}
 if(t.id==='undone'&&m){entry(+m[1],m[2]).done=false;markDirty();render();return}
 if(t.dataset.addset&&m){entry(+m[1],m[2],t.dataset.addset,true).sets.push(['','']);markDirty();render();return}
 if(t.dataset.rmset&&m){var es=entry(+m[1],m[2],t.dataset.rmset,true);if(es.sets.length>1)es.sets.pop();markDirty();render();return}
 if(t.dataset.hx){histEx=t.dataset.hx;var sy=window.scrollY;render();window.scrollTo(0,sy);return}
 if(t.dataset.seg){var sp=t.dataset.seg.split('|');if(sp[0]==='lift')liftMetric=sp[1];else bwRange=sp[1];var sy2=window.scrollY;render();window.scrollTo(0,sy2);return}
 if(t.dataset.rest){startRest(+t.dataset.rest);return}
 if(t.id==='reststop'){stopRest();return}
 if(t.dataset.chart){histEx=t.dataset.chart;go('history');return}
 if(t.dataset.mv){var p=t.dataset.mv.split('|'),d=day(p[0]),i=+p[1],j=i+(+p[2]);if(j<0||j>=d.exercises.length)return;var tmp=d.exercises[i];d.exercises[i]=d.exercises[j];d.exercises[j]=tmp;markDirty();render();return}
 if(t.dataset.del){var q=t.dataset.del.split('|');delEx(q[0],q[1]);return}
 if(t.dataset.addex){var de=day(t.dataset.addex);de.exercises.push({id:'e'+(S.nextId++),name:'New exercise'});markDirty();render();var ins=document.querySelectorAll('[data-ren^="'+de.id+'|"]');var last=ins[ins.length-1];if(last){last.focus();last.select()}return}
 if(t.dataset.unarch){var a=S.archived.filter(function(z){return z.id===t.dataset.unarch})[0];var dd=day(a.day)||S.days[0];dd.exercises.push({id:a.id,name:a.name});S.archived=S.archived.filter(function(z){return z!==a});markDirty();render();toast('Restored to '+dd.name);return}
 if(t.dataset.cadj){var n=S.cycle+(+t.dataset.cadj);if(n<1)return;S.cycle=n;viewCycle=null;markDirty();render();return}
 if(t.id==='bwlog'){logBW(nextDay(),$('#bwin').value);return}
 if(t.id==='bwadd'){logBW($('#bwday').value,$('#bwval').value);return}
 if(t.dataset.bwedit){var k=+t.dataset.bwedit,cur=S.bw.filter(function(x){return x.n===k})[0];modal('Edit Day '+k,'','Save',function(v){logBW(k,v)},false,cur?cur.w:'');return}
 if(t.dataset.bwdel){var k2=+t.dataset.bwdel;modal('Delete entry?','Day '+k2+' will be removed.','Delete',function(){S.bw=S.bw.filter(function(x){return x.n!==k2});markDirty();save('Deleted');render()},true);return}
 if(t.id==='copybk'){var txt=JSON.stringify(S);try{navigator.clipboard.writeText(txt).then(function(){toast('Backup copied')},function(){$('#bk').value=txt;toast('Select & copy the text')})}catch(e){$('#bk').value=txt;toast('Select & copy the text')}return}
 if(t.id==='restore'){try{var o=JSON.parse($('#bk').value);if(!o.days||!o.log)throw 0;modal('Restore backup?','This replaces everything currently in the tracker.','Restore',function(){importObj(o)},true)}catch(e){toast('That isn\'t a valid backup')}return}
 if(t.id==='wipe'){modal('Clear all workouts?','All logged sets and notes are erased and you go back to Cycle 1. Exercises and body weight stay.','Clear',function(){S.log={};S.cycle=1;viewCycle=null;markDirty();save('Cleared');render()},true);return}
});
render();
})();
</script></body></html>
